name: Source distribution candidate

# Manual, on-demand packaging only. No public Release, tag, deployment or startup.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Committed source candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Archive the committed product source
        run: python scripts/build_source_candidate.py --output-dir dist
      - name: Upload download package and SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: builder-source-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
