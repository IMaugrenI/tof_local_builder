name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-smoke:
    name: Python smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r services/repo_bridge/requirements.txt

      - name: Ruff (advisory)
        run: ruff check --output-format=github --exit-zero .

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          SOURCE_REPO_PATH=. docker compose -f compose.yml config > /dev/null

      - name: Run tests
        run: python -m pytest -q
