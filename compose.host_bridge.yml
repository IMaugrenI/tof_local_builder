services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: tof_local_builder_ollama
    restart: unless-stopped
    ports:
      - "${BUILDER_BIND_HOST:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${OLLAMA_MODELS_PATH:-./data/ollama}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  default:
    name: tof_local_builder_host_bridge_net
